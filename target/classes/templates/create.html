<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form th:action="@{setuyaku/create}" method="post" th:object="${setuyakuModel}">
        <table>
            <h1>やせまるくん<h1>
            <tr>
                <td>食品名</td>
                <td><input type="text" th:field="*{food}" placeholder="からあげ"></td>
            </tr>
            <tr>
                <td>価格</td>
                <td><input type="number" th:field="*{price}" placeholder="100"></td>
            </tr>
            <tr>
                <td>カロリー</td>
                <td><input type="number" th:field="*{calorie}" placeholder="200"></td>
            </tr>
            <tr>
                <td><input type="submit" value="登録"></td>
            </tr>
        </table>
    
</body>
</html>
