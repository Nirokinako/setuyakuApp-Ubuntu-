<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>user-login</title>
</head>
<body>
    <h1>ログイン</h1>
    <form th:action="@{setuyaku/login}" method="post" th:object="${loginModel}">
        <table>
            <tr>
                <td>ユーザーID</td>
                <td><input type="text" th:field="*{userName}" placeholder="user_1234"></td>
            </tr>
            <tr>
                <td>パスワード</td>
                <td><input type="password" th:field="*{password}" placeholder="pass_1234"></td>
            </tr>
        </table>
    </form>
    <form th:action="@{/setuyaku/form}" method="get">
        <input type="submit" value="ログイン">
    </form>
</body>
</html>
